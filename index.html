<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Travel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Dream Travel</h1>
        <p>Your next adventure starts here</p>
    </header>

    <nav>
        <a href="#">Home</a>
        <a href="#">Destinations</a>
        <a href="#">Reviews</a>
        <a href="#">Contact</a>
    </nav>

    <main>

        <section class="cards">

            <div class="card">
                <img src="https://picsum.photos/300/200?1" alt="Paris">
                <h2>Paris</h2>
                <p>Romantic city with amazing culture and food.</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?2" alt="Tokyo">
                <h2>Tokyo</h2>
                <p>Modern city full of technology and attractions.</p>
            </div>

            <div class="card">
                <img src="https://picsum.photos/300/200?3" alt="Rome">
                <h2>Rome</h2>
                <p>Historic destination with beautiful architecture.</p>
            </div>

        </section>

        <section class="form-section">

            <h2>Book Your Vacation</h2>

            <form>

                <input type="text" placeholder="Full Name" required>

                <input type="email" placeholder="Email Address" required>

                <input type="date" required>

                <select required>
                    <option value="">Choose Destination</option>
                    <option>Paris</option>
                    <option>Tokyo</option>
                    <option>Rome</option>
                </select>

                <input type="number" min="1" max="10" placeholder="Passengers">

                <label>
                    <input type="checkbox">
                    Include Hotel
                </label>

                <button type="submit">Book Now</button>

            </form>

        </section>

    </main>

    <footer>
        <p>Dream Travel © 2026</p>
    </footer>

</body>
</html>
